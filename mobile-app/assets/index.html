<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Galaxy Chat</title>
<style>
  :root {
    --bg: #0A0A0B;
    --surface: #141416;
    --surface2: #1B1B1E;
    --surface3: #24242A;
    --accent: #30ABED;
    --accent2: #7F18B3;
    --accent-glow: rgba(48,171,237,0.25);
    --text: #F2F3F5;
    --text-muted: #93979E;
    --border: rgba(190,195,205,0.12);
    --border-bright: rgba(48,171,237,0.35);
    --ok: #25D9A4;
    --warn: #FFB443;
    --danger: #FF5C7A;
    --radius: 16px;
    --bubble-me: linear-gradient(135deg, #2563EB 0%, #7F18B3 100%);
    --bubble-them: #1B1B1F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  input, textarea, button { font-family: inherit; }

  /* Screens */
  .screen { display: none; width: 100vw; height: 100vh; flex-direction: column; position: fixed; inset: 0; background: var(--bg); }
  .screen.active { display: flex; }

  /* Login Screen */
  #screenLogin {
    justify-content: center;
    align-items: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 15%, rgba(48,171,237,0.18), transparent 60%),
                radial-gradient(circle at 80% 85%, rgba(127,24,179,0.15), transparent 60%),
                var(--bg);
  }
  .login-card {
    width: min(380px, 100%);
    background: rgba(20,20,22,0.85);
    border: 1px solid var(--border-bright);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .login-brand { text-align: center; margin-bottom: 24px; }
  .login-brand .logo-wrap {
    width: 68px; height: 68px; border-radius: 20px;
    background: linear-gradient(135deg, #0A0A0B, #1B1B1E);
    border: 1px solid var(--border-bright);
    margin: 0 auto 12px; display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(48,171,237,0.3);
  }
  .login-brand h1 {
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
    background: linear-gradient(96deg, #30ABED, #C9CCD2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .login-brand p { font-size: 12px; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.05em; text-transform: uppercase; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%; height: 46px; background: rgba(10,10,11,0.8);
    border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); padding: 0 14px; font-size: 14px; outline: none;
    transition: 0.16s;
  }
  .input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .input-wrap .eye-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer;
  }
  .btn-primary {
    width: 100%; height: 48px; border: 0; border-radius: 12px;
    background: linear-gradient(96deg, var(--accent) 0%, var(--accent2) 100%);
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 24px rgba(127,24,179,0.35); transition: 0.15s; margin-top: 8px;
  }
  .btn-primary:active { transform: scale(0.98); }
  .login-err {
    background: rgba(255,92,122,0.12); border: 1px solid rgba(255,92,122,0.35);
    color: #FFB0BF; padding: 10px 12px; border-radius: 10px; font-size: 12.5px;
    margin-bottom: 14px; display: none;
  }

  /* Main Shell */
  .top-bar {
    height: 56px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    flex-shrink: 0; z-index: 10;
  }
  .brand-title { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .brand-title h2 { font-size: 17px; font-weight: 800; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text-muted); display: grid; place-items: center;
    cursor: pointer;
  }
  .icon-btn:active { background: var(--surface3); color: var(--text); }

  /* Navigation Tabs */
  .nav-tabs {
    display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 12px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 12px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted);
    background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer;
    white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .badge {
    background: var(--accent2); color: #fff; font-size: 11px; padding: 1px 6px;
    border-radius: 10px; font-weight: 800; min-width: 18px; text-align: center;
  }

  /* Search Bar */
  .search-wrap { padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .search-box {
    width: 100%; height: 38px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: 0 12px; font-size: 13.5px; outline: none;
  }
  .search-box:focus { border-color: var(--accent); }

  /* Conversation List */
  .conv-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .conv-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer;
    transition: background 0.12s;
  }
  .conv-item:active { background: var(--surface2); }
  .avatar {
    width: 46px; height: 46px; border-radius: 16px;
    background: linear-gradient(135deg, #1E293B, #0F172A);
    border: 1px solid var(--border-bright);
    display: grid; place-items: center; font-size: 18px; font-weight: 800;
    color: var(--accent); flex-shrink: 0;
  }
  .conv-info { flex: 1; min-width: 0; }
  .conv-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .conv-name { font-size: 14.5px; font-weight: 700; truncate; }
  .conv-time { font-size: 11px; color: var(--text-muted); }
  .conv-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .conv-last { font-size: 12.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .role-tag {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 6px; border-radius: 6px;
  }
  .role-admin { background: rgba(255,92,122,0.18); color: #FF708F; }
  .role-manager { background: rgba(139,147,184,0.18); color: #B9C2FF; }
  .role-agent { background: rgba(48,171,237,0.18); color: #7DF0DA; }
  .role-client { background: rgba(199,209,248,0.18); color: #9AD8FF; }

  /* Floating Action Button */
  .fab {
    position: fixed; right: 20px; bottom: 24px; width: 54px; height: 54px;
    border-radius: 18px; background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: 0; color: #fff; font-size: 24px; display: grid; place-items: center;
    box-shadow: 0 12px 28px rgba(127,24,179,0.4); cursor: pointer; z-index: 20;
  }
  .fab:active { transform: scale(0.95); }

  /* Chat Screen */
  #screenChat { z-index: 30; }
  .chat-header {
    height: 58px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 0 12px; flex-shrink: 0;
  }
  .chat-header .back-btn {
    width: 36px; height: 36px; border-radius: 10px; background: transparent;
    border: 0; color: var(--text); font-size: 20px; cursor: pointer; display: grid; place-items: center;
  }
  .chat-header .partner-info { flex: 1; min-width: 0; }
  .chat-header .partner-name { font-size: 15px; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-header .partner-sub { font-size: 11px; color: var(--ok); display: flex; align-items: center; gap: 4px; }
  .chat-header .partner-sub.offline { color: var(--text-muted); }

  .msg-container {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 82%; }
  .msg-row.mine { align-self: flex-end; align-items: flex-end; }
  .msg-row.them { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4;
    word-break: break-word; position: relative;
  }
  .msg-row.mine .bubble {
    background: var(--bubble-me); color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 6px 18px rgba(37,99,235,0.25);
  }
  .msg-row.them .bubble {
    background: var(--bubble-them); color: var(--text);
    border: 1px solid var(--border); border-bottom-left-radius: 4px;
  }
  .bubble-meta {
    font-size: 10px; color: rgba(255,255,255,0.65); margin-top: 4px;
    display: flex; align-items: center; gap: 4px; justify-content: flex-end;
  }
  .msg-row.them .bubble-meta { color: var(--text-muted); justify-content: flex-start; }
  .ticks { font-size: 12px; }
  .ticks.read { color: #84EFC9; font-weight: bold; }

  /* Input Box */
  .chat-input-bar {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .chat-input {
    flex: 1; min-height: 40px; max-height: 110px; background: rgba(10,10,11,0.7);
    border: 1px solid var(--border); border-radius: 20px; color: var(--text);
    padding: 10px 16px; font-size: 14px; outline: none; resize: none; line-height: 1.35;
  }
  .chat-input:focus { border-color: var(--accent); }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: 0; color: #fff; display: grid; place-items: center; cursor: pointer;
    flex-shrink: 0; box-shadow: 0 4px 12px rgba(127,24,179,0.3);
  }
  .send-btn:disabled { opacity: 0.4; cursor: default; }

  /* Modals */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; place-items: center; z-index: 100; padding: 20px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .modal-overlay.active { display: grid; }
  .modal-box {
    width: min(400px, 100%); background: var(--surface); border: 1px solid var(--border-bright);
    border-radius: 20px; padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.8);
    max-height: 85vh; display: flex; flex-direction: column;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head h3 { font-size: 16.5px; font-weight: 750; }
  .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
  .contact-list { overflow-y: auto; max-height: 50vh; display: flex; flex-direction: column; gap: 8px; }
  .contact-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
    cursor: pointer;
  }
  .contact-item:active { border-color: var(--accent); background: var(--surface3); }
</style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div class="screen active" id="screenLogin">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-wrap">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#30ABED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1>GALAXY CHAT</h1>
      <p>Secure Mobile Messaging</p>
    </div>

    <div id="loginErr" class="login-err"></div>

    <div class="field">
      <label>Server Host</label>
      <div class="input-wrap">
        <input type="text" id="lServer" placeholder="https://powerx.example.com" value=""/>
      </div>
    </div>

    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <input type="text" id="lUser" placeholder="Enter username" autocomplete="username"/>
      </div>
    </div>

    <div class="field">
      <label>Chat Password</label>
      <div class="input-wrap">
        <input type="password" id="lPass" placeholder="Dedicated chat password" autocomplete="current-password"/>
        <button type="button" class="eye-btn" onclick="togglePassVis()">👁</button>
      </div>
    </div>

    <button type="button" class="btn-primary" id="btnLogin" onclick="doLogin()">Log In to Chat</button>
  </div>
</div>

<!-- 2. MAIN LIST SCREEN -->
<div class="screen" id="screenMain">
  <header class="top-bar">
    <div class="brand-title">
      <span class="brand-dot"></span>
      <h2>Galaxy Chat</h2>
    </div>
    <div class="top-actions">
      <span id="uBadge" class="role-tag role-agent">Me</span>
      <button class="icon-btn" onclick="doLogout()" title="Logout">🚪</button>
    </div>
  </header>

  <div class="nav-tabs" id="tabContainer">
    <button class="tab-btn active" data-tab="chats" onclick="switchTab('chats')">
      Chats <span class="badge" id="bChats" style="display:none">0</span>
    </button>
    <button class="tab-btn" data-tab="complaints" onclick="switchTab('complaints')">
      Complaints <span class="badge" id="bComp" style="display:none">0</span>
    </button>
    <!-- Admin-only dynamic tabs inserted here -->
  </div>

  <div class="search-wrap">
    <input type="text" class="search-box" id="sQuery" placeholder="Search conversations or contacts..." oninput="filterConversations()"/>
  </div>

  <div class="conv-list" id="convContainer">
    <!-- Populated by JS -->
  </div>

  <button class="fab" onclick="openNewChatModal()" title="Start New Chat">+</button>
</div>

<!-- 3. CHAT VIEW SCREEN -->
<div class="screen" id="screenChat">
  <header class="chat-header">
    <button class="back-btn" onclick="closeChat()">‹</button>
    <div class="avatar" id="cAvatar" style="width:38px;height:38px;font-size:15px">U</div>
    <div class="partner-info">
      <div class="partner-name" id="cPartnerName">User</div>
      <div class="partner-sub" id="cPartnerRole">Agent</div>
    </div>
  </header>

  <div class="msg-container" id="msgBox">
    <!-- Messages populated here -->
  </div>

  <div class="chat-input-bar">
    <textarea class="chat-input" id="mInput" rows="1" placeholder="Type a message..." oninput="autoExpand(this)"></textarea>
    <button class="send-btn" id="mSend" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- 4. CONTACTS MODAL -->
<div class="modal-overlay" id="contactModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>New Conversation</h3>
      <button class="modal-close" onclick="closeModal('contactModal')">✕</button>
    </div>
    <div style="margin-bottom:12px">
      <input type="text" class="search-box" id="cSearch" placeholder="Search authorized users..." oninput="filterContacts()"/>
    </div>
    <div class="contact-list" id="contactContainer">
      <!-- Populated via GET /api/chat/contacts -->
    </div>
  </div>
</div>

<!-- 5. NEW COMPLAINT MODAL -->
<div class="modal-overlay" id="compModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Submit Complaint</h3>
      <button class="modal-close" onclick="closeModal('compModal')">✕</button>
    </div>
    <div class="field">
      <label>Subject</label>
      <input type="text" id="compSubject" class="search-box" placeholder="Brief subject" maxlength="150"/>
    </div>
    <div class="field">
      <label>Details</label>
      <textarea id="compBody" class="chat-input" rows="4" style="border-radius:12px" placeholder="Describe the issue for the Admin team..."></textarea>
    </div>
    <button type="button" class="btn-primary" onclick="submitComplaint()">Submit to Admin</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // State
  const S = {
    server: '',
    token: '',
    user: null,
    convs: [],
    contacts: [],
    complaints: [],
    activeTab: 'chats',
    activeConv: null,
    messages: [],
    es: null,
    pollTimer: null,
    lastMsgId: 0
  };

  // Bridge helper
  const Native = window.GalaxyNative || {
    getDeviceToken: () => 'web_dummy_' + Math.random().toString(36).slice(2),
    savePref: (k, v) => { try { localStorage.setItem(k, v); } catch(e){} },
    getPref: (k) => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
    vibrate: (ms) => { if (navigator.vibrate) navigator.vibrate(ms); },
    toast: (msg) => { alert(msg); },
    showNotification: (title, body) => {}
  };

  function $(id) { return document.getElementById(id); }

  window.handleAppBack = function() {
    if ($('screenChat').classList.contains('active')) {
      closeChat();
      return true;
    }
    if ($('contactModal').classList.contains('active')) {
      closeModal('contactModal');
      return true;
    }
    return false;
  };

  // Init server URL & saved token
  function init() {
    let savedServer = Native.getPref('galaxy_server') || location.origin;
    if (!savedServer || savedServer === 'null' || savedServer.startsWith('file:')) {
      savedServer = 'http://127.0.0.1:4000';
    }
    $('lServer').value = savedServer;

    const savedToken = Native.getPref('galaxy_chat_token');
    const savedUserStr = Native.getPref('galaxy_chat_user');
    if (savedToken && savedUserStr) {
      try {
        S.server = savedServer;
        S.token = savedToken;
        S.user = JSON.parse(savedUserStr);
        showMainScreen();
        return;
      } catch (e) {}
    }
  }

  window.togglePassVis = function() {
    const p = $('lPass');
    p.type = p.type === 'password' ? 'text' : 'password';
  };

  async function api(path, method = 'GET', body = null) {
    const url = S.server.replace(/\/+$/, '') + path;
    const headers = { 'Content-Type': 'application/json' };
    if (S.token) headers['Authorization'] = 'Bearer ' + S.token;

    const opt = { method, headers };
    if (body) opt.body = JSON.stringify(body);

    const r = await fetch(url, opt);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  window.doLogin = async function() {
    const server = $('lServer').value.trim();
    const username = $('lUser').value.trim();
    const password = $('lPass').value;
    const errBox = $('loginErr');
    errBox.style.display = 'none';

    if (!username || !password) {
      errBox.textContent = 'Please enter username and chat password.';
      errBox.style.display = 'block';
      return;
    }

    $('btnLogin').disabled = true;
    $('btnLogin').textContent = 'Connecting...';

    try {
      S.server = server;
      const res = await api('/api/chat/auth/login', 'POST', { username, password });
      S.token = res.token;
      S.user = res.user;

      Native.savePref('galaxy_server', S.server);
      Native.savePref('galaxy_chat_token', S.token);
      Native.savePref('galaxy_chat_user', JSON.stringify(S.user));

      // Register device token
      const deviceTok = Native.getDeviceToken();
      api('/api/chat/device-token', 'POST', { token: deviceTok, platform: 'android', app_version: '1.0.0' }).catch(() => {});

      showMainScreen();
    } catch (e) {
      errBox.textContent = e.message;
      errBox.style.display = 'block';
    } finally {
      $('btnLogin').disabled = false;
      $('btnLogin').textContent = 'Log In to Chat';
    }
  };

  window.doLogout = function() {
    if (!confirm('Log out from Galaxy Chat?')) return;
    if (S.es) { S.es.close(); S.es = null; }
    clearInterval(S.pollTimer);
    Native.savePref('galaxy_chat_token', '');
    Native.savePref('galaxy_chat_user', '');
    S.token = '';
    S.user = null;
    $('screenMain').classList.remove('active');
    $('screenChat').classList.remove('active');
    $('screenLogin').classList.add('active');
  };

  function showMainScreen() {
    $('screenLogin').classList.remove('active');
    $('screenMain').classList.add('active');

    $('uBadge').textContent = S.user.username;
    $('uBadge').className = 'role-tag role-' + S.user.role;

    setupTabs();
    loadConversations();
    connectSSE();
  }

  function setupTabs() {
    const cont = $('tabContainer');
    if (S.user.role === 'admin') {
      cont.innerHTML = `
        <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">All Chats</button>
        <button class="tab-btn" data-tab="managers" onclick="switchTab('managers')">Managers</button>
        <button class="tab-btn" data-tab="agents" onclick="switchTab('agents')">Agents</button>
        <button class="tab-btn" data-tab="clients" onclick="switchTab('clients')">Clients</button>
        <button class="tab-btn" data-tab="complaints" onclick="switchTab('complaints')">Complaints <span class="badge" id="bComp" style="display:none">0</span></button>
      `;
    } else {
      cont.innerHTML = `
        <button class="tab-btn active" data-tab="chats" onclick="switchTab('chats')">Chats <span class="badge" id="bChats" style="display:none">0</span></button>
        <button class="tab-btn" data-tab="complaints" onclick="switchTab('complaints')">Complaints <span class="badge" id="bComp" style="display:none">0</span></button>
      `;
    }
  }

  window.switchTab = function(tab) {
    S.activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });

    if (tab === 'complaints') {
      loadComplaints();
    } else {
      loadConversations();
    }
  };

  async function loadConversations() {
    try {
      let url = '/api/chat/conversations';
      if (S.user.role === 'admin') {
        url += `?scope=all&filter=${S.activeTab}`;
      }
      S.convs = await api(url);
      renderConversations();
      updateBadges();
    } catch (e) {}
  }

  function renderConversations() {
    const cont = $('convContainer');
    const q = $('sQuery').value.trim().toLowerCase();

    let list = S.convs;
    if (q) {
      list = list.filter(c => {
        const name = (c.other ? c.other.name : (c.user_a.name + ' ' + c.user_b.name)).toLowerCase();
        const last = (c.last_message_text || '').toLowerCase();
        return name.includes(q) || last.includes(q);
      });
    }

    if (!list.length) {
      cont.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--text-muted)">
        <p style="font-size:15px;margin-bottom:8px">No conversations found</p>
        <p style="font-size:12px">Tap the <b>+</b> button below to start a chat.</p>
      </div>`;
      return;
    }

    cont.innerHTML = list.map(c => {
      const partner = c.other || (S.user.id === c.user_a.id ? c.user_b : c.user_a);
      const initial = (partner.name || partner.username).charAt(0).toUpperCase();
      const time = c.last_message_at ? c.last_message_at.slice(11, 16) : '';
      const unreadBadge = c.unread > 0 ? `<span class="badge">${c.unread}</span>` : '';

      return `
        <div class="conv-item" onclick="openChat(${c.id})">
          <div class="avatar">${initial}</div>
          <div class="conv-info">
            <div class="conv-top">
              <span class="conv-name">${partner.name || partner.username}</span>
              <span class="conv-time">${time}</span>
            </div>
            <div class="conv-bottom">
              <span class="conv-last">${c.last_message_text || 'No messages yet'}</span>
              <div style="display:flex;align-items:center;gap:6px">
                <span class="role-tag role-${partner.role}">${partner.role_label || partner.role}</span>
                ${unreadBadge}
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  window.filterConversations = function() {
    renderConversations();
  };

  async function loadComplaints() {
    try {
      S.complaints = await api('/api/complaints');
      renderComplaints();
    } catch (e) {}
  }

  function renderComplaints() {
    const cont = $('convContainer');
    if (!S.complaints.length) {
      cont.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--text-muted)">
        <p style="font-size:15px;margin-bottom:8px">No complaints submitted</p>
        <p style="font-size:12px">Formal complaints submitted to Admin appear here.</p>
      </div>`;
      return;
    }

    cont.innerHTML = S.complaints.map(c => {
      const stColor = c.status === 'Resolved' ? 'var(--ok)' : (c.status === 'In Progress' ? 'var(--accent)' : 'var(--warn)');
      return `
        <div class="conv-item" onclick="openComplaintView(${c.id})">
          <div class="avatar" style="background:#1B1B22;color:var(--warn)">⚠️</div>
          <div class="conv-info">
            <div class="conv-top">
              <span class="conv-name">#${c.id} ${c.subject}</span>
              <span class="conv-time">${(c.created_at || '').slice(5, 16)}</span>
            </div>
            <div class="conv-bottom">
              <span class="conv-last">${c.body}</span>
              <span class="role-tag" style="color:${stColor};background:rgba(255,255,255,0.06)">${c.status}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  window.openChat = async function(convId) {
    const conv = S.convs.find(c => c.id === convId);
    if (!conv) return;

    S.activeConv = conv;
    const partner = conv.other || (S.user.id === conv.user_a.id ? conv.user_b : conv.user_a);

    $('cAvatar').textContent = (partner.name || partner.username).charAt(0).toUpperCase();
    $('cPartnerName').textContent = partner.name || partner.username;
    $('cPartnerRole').textContent = partner.role_label || partner.role;

    $('screenChat').classList.add('active');
    loadMessages(convId);

    // Mark as read
    api(`/api/chat/messages/${convId}/read`, 'POST').catch(() => {});
  };

  window.closeChat = function() {
    $('screenChat').classList.remove('active');
    S.activeConv = null;
    loadConversations();
  };

  async function loadMessages(convId) {
    try {
      const res = await api(`/api/chat/messages/${convId}?limit=50`);
      S.messages = res.messages || [];
      renderMessages();
      scrollToBottom();
    } catch (e) {}
  }

  function renderMessages() {
    const box = $('msgBox');
    box.innerHTML = S.messages.map(m => {
      const mine = m.sender_id === S.user.id;
      const ticks = m.read_at ? '<span class="ticks read">✓✓</span>' : '<span class="ticks">✓</span>';
      const time = (m.created_at || '').slice(11, 16);

      return `
        <div class="msg-row ${mine ? 'mine' : 'them'}">
          <div class="bubble">
            ${escapeHtml(m.body)}
            <div class="bubble-meta">
              <span>${time}</span>
              ${mine ? ticks : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function scrollToBottom() {
    const box = $('msgBox');
    box.scrollTop = box.scrollHeight;
  }

  window.autoExpand = function(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  };

  window.sendMessage = async function() {
    const input = $('mInput');
    const text = input.value.trim();
    if (!text || !S.activeConv) return;

    input.value = '';
    autoExpand(input);

    try {
      Native.vibrate(20);
      const res = await api(`/api/chat/messages/${S.activeConv.id}`, 'POST', { body: text });
      if (res && res.message) {
        S.messages.push(res.message);
        renderMessages();
        scrollToBottom();
      }
    } catch (e) {
      alert('Failed to send: ' + e.message);
    }
  };

  // Contacts
  window.openNewChatModal = async function() {
    if (S.activeTab === 'complaints') {
      $('compModal').classList.add('active');
      return;
    }
    $('contactModal').classList.add('active');
    try {
      S.contacts = await api('/api/chat/contacts');
      renderContacts();
    } catch (e) {}
  };

  window.closeModal = function(id) {
    $(id).classList.remove('active');
  };

  function renderContacts() {
    const cont = $('contactContainer');
    const q = $('cSearch').value.trim().toLowerCase();

    let list = S.contacts;
    if (q) {
      list = list.filter(u => (u.name || '').toLowerCase().includes(q) || u.username.toLowerCase().includes(q));
    }

    if (!list.length) {
      cont.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted)">No authorized contacts available.</div>';
      return;
    }

    cont.innerHTML = list.map(u => `
      <div class="contact-item" onclick="startChatWith(${u.id})">
        <div class="avatar" style="width:36px;height:36px;font-size:14px">${(u.name || u.username).charAt(0).toUpperCase()}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:14px">${u.name || u.username}</div>
          <div style="font-size:11.5px;color:var(--text-muted)">@${u.username}</div>
        </div>
        <span class="role-tag role-${u.role}">${u.role_label || u.role}</span>
      </div>
    `).join('');
  }

  window.filterContacts = function() {
    renderContacts();
  };

  window.startChatWith = async function(targetUserId) {
    closeModal('contactModal');
    try {
      const res = await api('/api/chat/conversations', 'POST', { user_id: targetUserId });
      await loadConversations();
      openChat(res.conversation_id);
    } catch (e) {
      alert('Cannot start chat: ' + e.message);
    }
  };

  window.submitComplaint = async function() {
    const subject = $('compSubject').value.trim();
    const body = $('compBody').value.trim();
    if (!subject || !body) return alert('Subject and details are required');

    try {
      await api('/api/complaints', 'POST', { subject, body });
      closeModal('compModal');
      $('compSubject').value = '';
      $('compBody').value = '';
      alert('✅ Complaint submitted successfully to Admin.');
      loadComplaints();
    } catch (e) {
      alert('❌ ' + e.message);
    }
  };

  // Real-time SSE
  async function connectSSE() {
    if (S.es) return;
    try {
      const { ticket } = await api('/api/chat/ticket', 'POST');
      const streamUrl = S.server.replace(/\/+$/, '') + '/api/chat/stream?ticket=' + ticket;

      S.es = new EventSource(streamUrl);
      S.es.addEventListener('msg', (e) => {
        const data = JSON.parse(e.data);
        if (S.activeConv && S.activeConv.id === data.c) {
          S.messages.push(data.m);
          renderMessages();
          scrollToBottom();
          api(`/api/chat/messages/${data.c}/read`, 'POST').catch(() => {});
        } else {
          Native.showNotification('New message from ' + data.m.sender_name, data.m.body);
          Native.vibrate(50);
          loadConversations();
        }
      });

      S.es.addEventListener('read', (e) => {
        const data = JSON.parse(e.data);
        if (S.activeConv && S.activeConv.id === data.c) {
          S.messages.forEach(m => { if (m.sender_id === S.user.id) m.read_at = new Date().toISOString(); });
          renderMessages();
        }
      });

      S.es.addEventListener('revoked', () => {
        alert('🔒 Chat access has been disabled by Admin.');
        doLogout();
      });

      S.es.onerror = () => {
        if (S.es) { S.es.close(); S.es = null; }
        setTimeout(connectSSE, 5000);
      };
    } catch (e) {
      setTimeout(connectSSE, 8000);
    }
  }

  async function updateBadges() {
    try {
      const counts = await api('/api/chat/unread-count');
      const bChat = $('bChats');
      if (bChat) {
        bChat.textContent = counts.chat || 0;
        bChat.style.display = counts.chat > 0 ? 'inline-block' : 'none';
      }
      const bComp = $('bComp');
      if (bComp) {
        bComp.textContent = counts.complaints || 0;
        bComp.style.display = counts.complaints > 0 ? 'inline-block' : 'none';
      }
    } catch (e) {}
  }

  // Start app
  init();
})();
</script>
</body>
</html>
