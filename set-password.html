<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GALAXY SMS — Set Password</title>
<style>
  :root{--bg:#f4f7fb;--border:#e4eaf3;--border2:#d7e0ec;--text:#0f2454;--muted:#64748b;--blue:#1d4ed8;--ok:#16a34a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#f8fbff,#eef4fb);color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px;line-height:1.5}
  .card{width:min(460px,100%);background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 28px 80px rgba(10,10,11,.12);overflow:hidden}
  .head{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);padding:28px 34px;color:#fff}
  .head .logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;margin-bottom:12px}
  .head .logo svg{width:26px;height:26px;stroke:#1d4ed8}
  .head h1{font-size:20px;letter-spacing:.05em}.head p{font-size:11px;letter-spacing:3px;opacity:.8;margin-top:3px}
  .body{padding:34px}
  h2{font-size:26px;letter-spacing:-.04em;margin-bottom:8px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  .field{margin-bottom:16px}.field label{display:block;font-size:13.5px;font-weight:800;margin-bottom:7px}
  input{width:100%;border:1px solid var(--border2);background:#fff;color:var(--text);border-radius:13px;padding:12px 14px;font-size:15px;outline:none;transition:.16s}
  input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(37,99,235,.08)}
  .btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:15.5px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;box-shadow:0 12px 26px rgba(29,78,216,.28)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .msg{border-radius:12px;padding:11px 14px;font-size:13.5px;margin-bottom:16px;display:none}
  .msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
  .msg.ok{display:block;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}
  a{color:var(--blue)}
  .done{display:none;text-align:center}
  .done .big{width:74px;height:74px;border-radius:50%;background:#f0fdf4;border:1px solid #bbf7d0;display:grid;place-items:center;margin:0 auto 18px}
  .done .big svg{width:34px;height:34px;stroke:var(--ok)}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
    <h1>GALAXY SMS</h1><p>PREMIUM SMS PANEL</p>
  </div>
  <div class="body">
    <div id="pwForm">
      <h2>Set your password</h2>
      <div class="sub">This is a one-time secure link — use it to set your panel password.</div>
      <div class="msg" id="pmsg"></div>
      <div class="field"><label>New Password <span style="font-weight:400;color:var(--muted);font-size:12px">(min 8 characters)</span></label><input type="password" id="p1" maxlength="72" autocomplete="new-password"/></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="p2" maxlength="72" autocomplete="new-password"/></div>
      <button class="btn" id="pSet" type="button">Set Password</button>
    </div>
    <div class="done" id="pwDone">
      <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <h2>Your password has been set! 🎉</h2>
      <div class="sub" style="margin-top:10px">You can now log in with your username <b id="uName"></b>.</div>
      <a href="/panel-login" style="display:block;margin-top:18px;font-weight:800">→ Go to Panel Login</a>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var token = ''; try { token = new URLSearchParams(location.search).get('token') || ''; } catch(e){}
  var isChat = false; try { isChat = new URLSearchParams(location.search).get('type') === 'chat'; } catch(e){}
  function $(id){ return document.getElementById(id); }
  function msgErr(t){ var el=$('pmsg'); el.textContent=t||''; el.className='msg'+(t?' err':''); }
  if (!token) msgErr('This link is invalid — please open the full link from your email.');

  if (token) {
    fetch('/api/pubreq/token-info?token=' + encodeURIComponent(token))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.purpose === 'chat_password' || isChat) {
          isChat = true;
          document.querySelector('h2').textContent = 'Set your Galaxy Chat password';
          document.querySelector('.sub').textContent = 'This is a one-time secure link — use it to set your Galaxy Chat messaging password.';
          $('pSet').textContent = 'Set Chat Password';
          var doneSub = document.querySelector('#pwDone .sub');
          if (doneSub) doneSub.innerHTML = 'You can now log into Galaxy Chat Mobile App or internal chat with username <b id="uName"></b>.';
          var doneLink = document.querySelector('#pwDone a');
          if (doneLink) { doneLink.textContent = '✓ Setup complete — you can close this window'; doneLink.href = 'javascript:void(0)'; }
        }
      }).catch(function(){});
  }

  $('pSet').addEventListener('click', async function(){
    var p1=$('p1').value, p2=$('p2').value;
    if (!token) { msgErr('This link is invalid.'); return; }
    if (p1.length < 8) { msgErr('Your password must be at least 8 characters long.'); return; }
    if (p1 !== p2) { msgErr('The two passwords do not match.'); return; }
    $('pSet').disabled = true; msgErr('');
    try {
      var r = await fetch('/api/pubreq/set-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: token, password: p1 }) });
      var j = {}; try { j = await r.json(); } catch(e){}
      if (!r.ok) throw new Error(j.error || ('HTTP '+r.status));
      $('uName').textContent = j.username || '';
      $('pwForm').style.display='none'; $('pwDone').style.display='block';
    } catch(e){ msgErr(e.message); $('pSet').disabled = false; }
  });
})();
</script>
</body>
</html>
