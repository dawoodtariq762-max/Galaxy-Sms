<!doctype html><html lang="en" class="gx-light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/galaxy-favicon.png?v=light-20260928"><title>GALAXY SMS — Panel Sharing Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Segoe UI,Arial;}
.card{width:min(430px,92vw);border:1px solid #ddd;border-radius:22px;padding:28px;}

<link rel="stylesheet" href="/assets/galaxy.css?v=light-20260928"/><script src="/assets/galaxy.js?v=light-20260928" defer></script></head><body class="gx-light gx-portal-login"><div class="card"><div class="logo"><img src="/assets/galaxy-logo.png?v=light-20260928"></div><h1>Panel Sharing</h1><div class="sub">Admin only — external panel sharing management</div><form id="form"><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button>Login</button><div id="msg" class="msg"></div></form></div><script>function msg(t,c){const m=document.getElementById('msg');m.className='msg '+(c||'');m.textContent=t}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg('Checking...','ok');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Login failed');if(data.user.role!=='admin')throw new Error('Panel Sharing requires Admin account.');sessionStorage.setItem('ms_token',data.token);sessionStorage.setItem('ms_role',data.user.role);sessionStorage.setItem('ms_user',data.user.username);sessionStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_token',data.token);localStorage.setItem('ms_role',data.user.role);localStorage.setItem('ms_user',data.user.username);localStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_last_page_panelsharing','dashboard');location.href='/panel-sharing';}catch(err){msg('❌ '+err.message,'err')}});</script></body></html>
