<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Galaxy Chat</title>
<style>
  :root {
    --bg: #070D1F;
    --surface: #0D152D;
    --surface-elevated: #121C3B;
    --surface-card: #16244C;
    --surface-hover: #1E2E5E;
    --accent: #30ABED;
    --accent-glow: rgba(48,171,237,0.35);
    --accent2: #7F18B3;
    --accent-blue: #2563EB;
    --text: #F8FAFC;
    --text-muted: #94A3B8;
    --text-dim: #64748B;
    --border: rgba(48,171,237,0.18);
    --border-bright: rgba(48,171,237,0.42);
    --border-subtle: rgba(255,255,255,0.06);
    --ok: #10B981;
    --warn: #F59E0B;
    --danger: #EF4444;
    --bubble-me: linear-gradient(135deg, #1D4ED8 0%, #7F18B3 100%);
    --bubble-them: #121C3B;
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --bottom-nav-h: 62px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  input, textarea, button { font-family: inherit; }

  /* Screens */
  .screen { display: none; width: 100vw; height: 100vh; flex-direction: column; position: fixed; inset: 0; background: var(--bg); }
  .screen.active { display: flex; }

  /* Login Screen */
  #screenLogin {
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: radial-gradient(circle at 50% 12%, rgba(48,171,237,0.24), transparent 55%),
                radial-gradient(circle at 85% 85%, rgba(127,24,179,0.22), transparent 60%),
                var(--bg);
  }
  .login-card {
    width: min(390px, 100%);
    background: rgba(13,21,45,0.92);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-xl);
    padding: 32px 24px;
    box-shadow: 0 35px 85px rgba(0,0,0,0.88), inset 0 1px 0 rgba(255,255,255,0.12);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }
  .login-brand { text-align: center; margin-bottom: 26px; }
  .login-brand .logo-wrap {
    width: 74px; height: 74px; border-radius: 22px;
    background: linear-gradient(135deg, #070D1F, #16244C);
    border: 1.5px solid var(--border-bright);
    margin: 0 auto 14px; display: grid; place-items: center;
    box-shadow: 0 14px 34px rgba(48,171,237,0.38);
    cursor: pointer; transition: transform 0.15s;
  }
  .login-brand .logo-wrap:active { transform: scale(0.92); }
  .login-brand h1 {
    font-size: 24px; font-weight: 850; letter-spacing: -0.02em;
    background: linear-gradient(96deg, #30ABED 0%, #F1F5F9 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .login-brand p { font-size: 11.5px; color: var(--text-muted); margin-top: 5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }

  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%; height: 48px; background: rgba(7,13,31,0.85);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    color: var(--text); padding: 0 14px; font-size: 14.5px; outline: none;
    transition: border-color 0.16s, box-shadow 0.16s;
  }
  .input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .input-wrap .eye-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-muted); font-size: 17px; cursor: pointer; padding: 6px;
  }
  .btn-primary {
    width: 100%; height: 50px; border: 0; border-radius: var(--radius-md);
    background: linear-gradient(96deg, var(--accent) 0%, var(--accent2) 100%);
    color: #fff; font-size: 15.5px; font-weight: 750; cursor: pointer;
    box-shadow: 0 10px 28px rgba(127,24,179,0.42); transition: transform 0.15s, opacity 0.15s; margin-top: 10px;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }

  .login-err {
    background: rgba(239,68,68,0.14); border: 1px solid rgba(239,68,68,0.4);
    color: #FCA5A5; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px;
    margin-bottom: 14px; display: none;
  }
  .dev-badge {
    text-align: center; font-size: 11px; color: var(--accent);
    padding: 6px 10px; border-radius: 8px; background: rgba(48,171,237,0.12);
    margin-bottom: 12px; display: none;
  }

  /* Main Shell */
  .top-bar {
    height: 60px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    flex-shrink: 0; z-index: 10;
  }
  .brand-title { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .brand-dot.reconnecting { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .brand-title h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 11px; background: var(--surface-elevated);
    border: 1px solid var(--border); color: var(--text-muted); display: grid; place-items: center;
    cursor: pointer; transition: background 0.15s; font-size: 16px;
  }
  .icon-btn:active { background: var(--surface-card); color: var(--text); }

  /* Sub-Filter Chips for Chats (compact modern segment bar) */
  .chip-bar {
    display: flex; gap: 6px; padding: 8px 12px; background: var(--surface);
    overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
  }
  .chip-bar::-webkit-scrollbar { display: none; }
  .chip-btn {
    padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 650;
    color: var(--text-muted); background: var(--surface-elevated); border: 1px solid var(--border);
    white-space: nowrap; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .chip-btn.active {
    background: linear-gradient(96deg, var(--accent), var(--accent2));
    color: #fff; border-color: transparent; box-shadow: 0 3px 10px rgba(48,171,237,0.3);
  }

  /* Search Bar */
  .search-wrap { padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
  .search-box {
    width: 100%; height: 38px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); padding: 0 14px; font-size: 13.5px; outline: none;
    transition: border-color 0.15s;
  }
  .search-box:focus { border-color: var(--accent); }

  /* Content area above bottom nav */
  .main-content {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    padding-bottom: var(--bottom-nav-h); -webkit-overflow-scrolling: touch;
  }

  /* Conversation & Contact List */
  .conv-list { flex: 1; }
  .conv-item {
    display: flex; align-items: center; gap: 14px; padding: 13px 16px;
    border-bottom: 1px solid var(--border-subtle); cursor: pointer;
    transition: background 0.12s;
  }
  .conv-item:active { background: var(--surface-elevated); }
  .avatar {
    width: 48px; height: 48px; border-radius: 17px;
    background: linear-gradient(135deg, #121C3B, #1A2750);
    border: 1px solid var(--border-bright);
    display: grid; place-items: center; font-size: 18px; font-weight: 800;
    color: var(--accent); flex-shrink: 0;
  }
  .conv-info { flex: 1; min-width: 0; }
  .conv-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .conv-name { font-size: 15px; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-time { font-size: 11.5px; color: var(--text-muted); }
  .conv-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .conv-last { font-size: 12.8px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .role-tag {
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 3px 7px; border-radius: 6px;
  }
  .role-admin { background: rgba(239,68,68,0.22); color: #FCA5A5; border: 1px solid rgba(239,68,68,0.3); }
  .role-manager { background: rgba(167,139,250,0.20); color: #DDD6FE; border: 1px solid rgba(167,139,250,0.3); }
  .role-agent { background: rgba(56,189,248,0.20); color: #BAE6FD; border: 1px solid rgba(56,189,248,0.3); }
  .role-client { background: rgba(251,191,36,0.20); color: #FDE68A; border: 1px solid rgba(251,191,36,0.3); }

  .badge {
    background: var(--accent2); color: #fff; font-size: 10.5px; padding: 2px 7px;
    border-radius: 10px; font-weight: 800; min-width: 18px; text-align: center;
  }

  /* Floating Action Button (New Chat) */
  .fab {
    position: fixed; right: 20px; bottom: 80px; width: 54px; height: 54px;
    border-radius: 18px; background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: 0; color: #fff; font-size: 24px; display: grid; place-items: center;
    box-shadow: 0 14px 30px rgba(127,24,179,0.45); cursor: pointer; z-index: 20;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.92); }

  /* Modern Bottom Navigation Bar */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-h);
    background: rgba(13,21,45,0.96); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    z-index: 25; padding: 0 8px;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; background: none; border: 0; color: var(--text-muted); cursor: pointer;
    padding: 6px 0; transition: color 0.15s; position: relative;
  }
  .nav-item svg { width: 22px; height: 22px; transition: stroke 0.15s; }
  .nav-item span { font-size: 11px; font-weight: 650; }
  .nav-item.active { color: var(--accent); }
  .nav-item.active svg { stroke: var(--accent); }
  .nav-item .nav-badge {
    position: absolute; top: 4px; right: 24%; background: var(--accent2);
    color: #fff; font-size: 9.5px; font-weight: 800; padding: 1px 5px; border-radius: 8px;
  }

  /* Chat Screen */
  #screenChat { z-index: 30; }
  .chat-header {
    height: 60px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; padding: 0 12px; flex-shrink: 0;
  }
  .chat-header .back-btn {
    width: 36px; height: 36px; border-radius: 10px; background: transparent;
    border: 0; color: var(--text); font-size: 22px; cursor: pointer; display: grid; place-items: center;
  }
  .chat-header .partner-info { flex: 1; min-width: 0; }
  .chat-header .partner-name { font-size: 15.5px; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-header .partner-sub { font-size: 11.5px; color: var(--ok); display: flex; align-items: center; gap: 4px; }
  .chat-header .call-btn {
    width: 38px; height: 38px; border-radius: 11px; background: var(--surface-elevated);
    border: 1px solid var(--border); color: var(--accent); display: grid; place-items: center;
    cursor: pointer; font-size: 18px; margin-right: 4px;
  }

  .spectator-banner {
    background: linear-gradient(90deg, rgba(239,68,68,0.2), rgba(127,24,179,0.2));
    border-bottom: 1px solid rgba(239,68,68,0.3);
    padding: 6px 14px; font-size: 11px; font-weight: 700; color: #FECACA;
    display: none; align-items: center; justify-content: space-between;
  }

  .msg-container {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 84%; position: relative; }
  .msg-row.mine { align-self: flex-end; align-items: flex-end; }
  .msg-row.them { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.42;
    word-break: break-word; position: relative; cursor: pointer;
  }
  .msg-row.mine .bubble {
    background: var(--bubble-me); color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 6px 20px rgba(29,78,216,0.3);
  }
  .msg-row.them .bubble {
    background: var(--bubble-them); color: var(--text);
    border: 1px solid var(--border); border-bottom-left-radius: 4px;
  }
  .msg-row.them .bubble.spectator-bubble {
    border-left: 3.5px solid var(--accent);
  }

  /* Tombstone */
  .bubble.deleted-bubble {
    background: rgba(255,255,255,0.03) !important;
    border: 1px dashed rgba(255,255,255,0.16) !important;
    color: var(--text-muted) !important;
    font-style: italic;
    cursor: default;
    box-shadow: none !important;
  }

  .sender-header {
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11.5px; font-weight: 750;
  }
  .sender-header .sender-label { color: #BAE6FD; }

  .bubble-meta {
    font-size: 10.5px; color: rgba(255,255,255,0.65); margin-top: 4px;
    display: flex; align-items: center; gap: 4px; justify-content: flex-end;
  }
  .msg-row.them .bubble-meta { color: var(--text-muted); justify-content: flex-start; }
  .ticks { font-size: 12px; letter-spacing: -1px; }
  .ticks.read { color: #38BDF8; font-weight: 800; text-shadow: 0 0 6px rgba(56,189,248,0.5); }

  /* Input Bar */
  .chat-input-bar {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .chat-input {
    flex: 1; min-height: 40px; max-height: 110px; background: rgba(7,13,31,0.85);
    border: 1px solid var(--border); border-radius: 20px; color: var(--text);
    padding: 10px 16px; font-size: 14px; outline: none; resize: none; line-height: 1.35;
  }
  .chat-input:focus { border-color: var(--accent); }
  .action-icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-elevated); color: var(--text-muted); display: grid; place-items: center;
    cursor: pointer; font-size: 17px; flex-shrink: 0;
  }
  .action-icon-btn.recording {
    background: var(--danger); color: #fff; animation: pulseRed 1s infinite;
  }
  @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }

  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: 0; color: #fff; display: grid; place-items: center; cursor: pointer;
    flex-shrink: 0; box-shadow: 0 4px 14px rgba(127,24,179,0.35); font-size: 16px;
  }
  .send-btn:disabled { opacity: 0.35; cursor: default; }

  /* P21: File Attachments in Chat */
  .bubble-file-card {
    display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 8px 12px; margin: 4px 0 6px;
  }
  .file-icon { font-size: 22px; flex-shrink: 0; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-weight: 650; font-size: 13px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .file-dl-btn {
    background: rgba(56,189,248,0.18); border: 1px solid rgba(56,189,248,0.35); color: #38BDF8;
    border-radius: 8px; padding: 5px 10px; font-size: 11.5px; font-weight: 700; text-decoration: none;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
  }
  .file-dl-btn:active { background: #38BDF8; color: #fff; }

  .attach-preview-bar {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    background: rgba(14,165,233,0.12); border-top: 1px solid rgba(14,165,233,0.25);
    font-size: 12.5px; color: var(--text); flex-shrink: 0;
  }
  .attach-preview-bar .attach-x {
    background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; margin-left: auto;
  }
  .attach-preview-bar .attach-x:hover { color: var(--danger); }

  /* Action Sheet for Messages */
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    display: none; align-items: flex-end; justify-content: center; z-index: 120;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .sheet-overlay.active { display: flex; }
  .sheet-card {
    width: min(480px, 100%); background: var(--surface); border-top: 1px solid var(--border-bright);
    border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px 18px 28px;
    box-shadow: 0 -15px 40px rgba(0,0,0,0.85); animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 38px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; margin: 0 auto 16px; }
  .sheet-title { font-size: 12.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; text-align: center; }
  .sheet-btn {
    width: 100%; height: 48px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface-elevated); color: var(--text); font-size: 14.5px; font-weight: 650;
    margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; transition: background 0.12s;
  }
  .sheet-btn:active { background: var(--surface-card); }
  .sheet-btn.danger { color: #FCA5A5; border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.12); }
  .sheet-btn.danger:active { background: rgba(239,68,68,0.22); }
  .sheet-btn.cancel { background: transparent; border-color: transparent; color: var(--text-muted); margin-top: 4px; }

  /* Modals */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.78);
    display: none; place-items: center; z-index: 100; padding: 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .modal-overlay.active { display: grid; }
  .modal-box {
    width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border-bright);
    border-radius: var(--radius-lg); padding: 22px; box-shadow: 0 25px 65px rgba(0,0,0,0.85);
    max-height: 85vh; display: flex; flex-direction: column;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head h3 { font-size: 17px; font-weight: 800; }
  .modal-close { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
</style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div class="screen active" id="screenLogin">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-wrap" id="brandLogo" onclick="onLogoTap()">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#30ABED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1>GALAXY CHAT</h1>
      <p>Secure Enterprise Messaging</p>
    </div>

    <div id="devBadge" class="dev-badge">🔧 Developer Mode: Server Host Unlocked</div>
    <div id="loginErr" class="login-err"></div>

    <!-- Hidden by default; 5-tap developer bypass on logo reveals it -->
    <div class="field" id="wrapServer" style="display:none">
      <label>Server Host</label>
      <div class="input-wrap">
        <input type="text" id="lServer" placeholder="http://173.249.48.57" value=""/>
      </div>
    </div>

    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <input type="text" id="lUser" placeholder="Enter username" autocomplete="username"/>
      </div>
    </div>

    <div class="field">
      <label>Chat Password</label>
      <div class="input-wrap">
        <input type="password" id="lPass" placeholder="Enter dedicated chat password" autocomplete="current-password"/>
        <button type="button" class="eye-btn" onclick="togglePassVis()">👁</button>
      </div>
    </div>

    <button type="button" class="btn-primary" id="btnLogin" onclick="doLogin()">Log In to Chat</button>
  </div>
</div>

<!-- 2. MAIN LIST SCREEN -->
<div class="screen" id="screenMain">
  <header class="top-bar">
    <div class="brand-title">
      <span class="brand-dot" id="connDot" title="Connected"></span>
      <h2>Galaxy Chat</h2>
    </div>
    <div class="top-actions">
      <span id="uBadge" class="role-tag role-agent">Me</span>

        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>

<script>
(function() {
  'use strict';

  // EXACT PRODUCTION ENDPOINT PRE-CONFIGURED BY DEFAULT
  const PRODUCTION_SERVER_URL = 'http://173.249.48.57';

  // State
  const S = {
    server: PRODUCTION_SERVER_URL,
    token: '',
    user: null,
    convs: [],
    contacts: [],
    complaints: [],
    activeNav: 'chats',
    activeFilter: 'all',
    activeConv: null,
    messages: [],
    es: null,
    pollTimer: null,
    lastMsgId: 0,
    selectedMsg: null,
    audioCtx: null,
    seenNotifIds: new Set(),
    activeAudioPlayer: null
  };

  // Native Android Bridge Helper
  const Native = window.GalaxyNative || {
    getDeviceToken: () => 'web_dummy_' + Math.random().toString(36).slice(2),
    savePref: (k, v) => { try { localStorage.setItem(k, v); } catch(e){} },
    getPref: (k) => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
    vibrate: (ms) => { if (navigator.vibrate) navigator.vibrate(ms); },
    toast: (msg) => { alert(msg); },
    showNotification: (title, body) => {}
  };

  function $(id) { return document.getElementById(id); }

  // Synthesize notification chime via Web Audio API
  function playNotificationChime() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!S.audioCtx) S.audioCtx = new AudioCtx();
      if (S.audioCtx.state === 'suspended') S.audioCtx.resume();

      const now = S.audioCtx.currentTime;
      const osc = S.audioCtx.createOscillator();
      const gain = S.audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(gain);
      gain.connect(S.audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.35);
    } catch(e) {}
  }

  // Back button handling
  window.handleAppBack = function() {
    if ($('msgSheet').classList.contains('active')) {
      closeSheet();
      return true;
    }
    if ($('screenChat').classList.contains('active')) {
      closeChat();
      return true;
    }
    if ($('compModal').classList.contains('active')) {
      closeModal('compModal');
      return true;
    }
    return false;
  };

  // Developer mode bypass (5 logo taps reveals Server Host field)
  let logoTaps = 0;
  let logoTapTimer = null;
  window.onLogoTap = function() {
    logoTaps++;
    clearTimeout(logoTapTimer);
    logoTapTimer = setTimeout(() => { logoTaps = 0; }, 1500);

    if (logoTaps >= 5) {
      logoTaps = 0;
      const wrap = $('wrapServer');
      const badge = $('devBadge');
      const isHidden = wrap.style.display === 'none';
      wrap.style.display = isHidden ? 'block' : 'none';
      badge.style.display = isHidden ? 'block' : 'none';
      Native.vibrate(50);
      if (isHidden) Native.toast('Developer mode: Server Host unlocked');
    }
  };

  // Initialize
  function init() {
    let savedServer = Native.getPref('galaxy_server');
    // If empty or set to legacy localhost/127.0.0.1, automatically point to production
    if (!savedServer || savedServer === 'null' || savedServer.startsWith('file:') || savedServer.includes('127.0.0.1') || savedServer.includes('localhost')) {
      savedServer = PRODUCTION_SERVER_URL;
      Native.savePref('galaxy_server', PRODUCTION_SERVER_URL);
    }
    $('lServer').value = savedServer;
    S.server = savedServer;

    const savedToken = Native.getPref('galaxy_chat_token');
    const savedUserStr = Native.getPref('galaxy_chat_user');
    const mInput = $('mInput');
    if (mInput) {
      mInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    }
    if (savedToken && savedUserStr) {
      try {
        S.token = savedToken;
        S.user = JSON.parse(savedUserStr);
        showMainScreen();
        return;
      } catch (e) {}
    }
  }

  window.togglePassVis = function() {
    const p = $('lPass');
    p.type = p.type === 'password' ? 'text' : 'password';
  };

  async function api(path, method = 'GET', body = null) {
    const url = S.server.replace(/\/+$/, '') + path;
    const headers = { 'Content-Type': 'application/json' };
    if (S.token) headers['Authorization'] = 'Bearer ' + S.token;

    const opt = { method, headers };
    if (body) opt.body = JSON.stringify(body);

    const r = await fetch(url, opt);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  window.doLogin = async function() {
    const serverInput = $('lServer').value.trim();
    const server = serverInput || PRODUCTION_SERVER_URL;
    const username = $('lUser').value.trim();
    const password = $('lPass').value;
    const errBox = $('loginErr');
    errBox.style.display = 'none';

    if (!username || !password) {
      errBox.textContent = 'Please enter username and chat password.';
      errBox.style.display = 'block';
      return;
    }

    $('btnLogin').disabled = true;
    $('btnLogin').textContent = 'Connecting...';

    try {
      S.server = server;
      const res = await api('/api/chat/auth/login', 'POST', { username, password });
      S.token = res.token;
      S.user = res.user;

      Native.savePref('galaxy_server', S.server);
      Native.savePref('galaxy_chat_token', S.token);
      Native.savePref('galaxy_chat_user', JSON.stringify(S.user));

      const deviceTok = Native.getDeviceToken();
      api('/api/chat/device-token', 'POST', { token: deviceTok, platform: 'android', app_version: '2.0.0' }).catch(() => {});

      showMainScreen();
    } catch (e) {
      errBox.textContent = e.message;
      errBox.style.display = 'block';
    } finally {
      $('btnLogin').disabled = false;
      $('btnLogin').textContent = 'Log In to Chat';
    }
  };

  window.doLogout = function() {
    if (!confirm('Log out from Galaxy Chat?')) return;
    if (S.es) { S.es.close(); S.es = null; }
    clearInterval(S.pollTimer);
    Native.savePref('galaxy_chat_token', '');
    Native.savePref('galaxy_chat_user', '');
    S.token = '';
    S.user = null;
    $('screenMain').classList.remove('active');
    $('screenChat').classList.remove('active');
    $('screenLogin').classList.add('active');
  };

  function showMainScreen() {
    $('screenLogin').classList.remove('active');
    $('screenMain').classList.add('active');

    $('uBadge').textContent = S.user.username;
    $('uBadge').className = 'role-tag role-' + S.user.role;

    setupChips();
    loadConversations();
    connectSSE();
  }

  // Setup Role-Based Chips (Clean horizontal segment inside Chats tab)
  function setupChips() {
    const cont = $('chipContainer');
    const r = S.user.role;

    if (r === 'admin') {
      cont.innerHTML = `
        <button class="chip-btn active" data-filter="direct" onclick="switchFilter('direct')">My Direct</button>
        <button class="chip-btn" data-filter="manager_chats" onclick="switchFilter('manager_chats')">Managers</button>
        <button class="chip-btn" data-filter="agent_chats" onclick="switchFilter('agent_chats')">Agents</button>
        <button class="chip-btn" data-filter="client_chats" onclick="switchFilter('client_chats')">Clients</button>
        <button class="chip-btn" data-filter="all" onclick="switchFilter('all')">All System</button>
      `;
      S.activeFilter = 'direct';
    } else if (r === 'manager') {
      cont.innerHTML = `
        <button class="chip-btn active" data-filter="agents" onclick="switchFilter('agents')">My Agents</button>
        <button class="chip-btn" data-filter="admin" onclick="switchFilter('admin')">Admin Support</button>
      `;
      S.activeFilter = 'agents';
    } else if (r === 'agent') {
      cont.innerHTML = `
        <button class="chip-btn active" data-filter="clients" onclick="switchFilter('clients')">My Clients</button>
        <button class="chip-btn" data-filter="manager" onclick="switchFilter('manager')">My Manager</button>
      `;
      S.activeFilter = 'clients';
    } else { // client
      cont.innerHTML = `
        <button class="chip-btn active" data-filter="manager" onclick="switchFilter('manager')">My Agent</button>
      `;
      S.activeFilter = 'manager';
    }
  }

  window.switchFilter = function(filter) {
    S.activeFilter = filter;
    document.querySelectorAll('.chip-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === filter);
    });
    loadConversations();
  };

  // Modern Bottom Navigation Tab Switcher
  window.switchNav = function(nav) {
    S.activeNav = nav;
    document.querySelectorAll('.nav-item').forEach(b => {
      b.classList.toggle('active', b.dataset.nav === nav);
    });

    const chipBar = $('chipContainer');
    const searchWrap = $('searchWrap');
    const fab = $('fabNew');

    if (nav === 'chats') {
      chipBar.style.display = 'flex';
      searchWrap.style.display = 'block';
      fab.style.display = 'grid';
      loadConversations();
    } else if (nav === 'contacts') {
      chipBar.style.display = 'none';
      searchWrap.style.display = 'block';
      fab.style.display = 'none';
      loadContacts();
    } else if (nav === 'support') {
      chipBar.style.display = 'none';
      searchWrap.style.display = 'none';
      fab.style.display = 'grid';
      loadComplaints();
    } else if (nav === 'account') {
      chipBar.style.display = 'none';
      searchWrap.style.display = 'none';
      fab.style.display = 'none';
      renderAccountView();
    }
  };

  async function loadConversations() {
    try {
      let url = '/api/chat/conversations';
      if (S.user.role === 'admin') {
        url += `?scope=all&filter=${S.activeFilter}`;
      } else {
        url += `?filter=${S.activeFilter}`;
      }
      S.convs = await api(url);
      renderConversations();
      updateBadges();
    } catch (e) {}
  }

  function renderConversations() {
    const cont = $('convContainer');
    const q = $('sQuery').value.trim().toLowerCase();

    let list = S.convs;
    if (q) {
      list = list.filter(c => {
        const partnerName = c.other ? (c.other.name || c.other.username) : ((c.user_a ? c.user_a.name : '') + ' ' + (c.user_b ? c.user_b.name : ''));
        const last = (c.last_message_text || '').toLowerCase();
        return partnerName.toLowerCase().includes(q) || last.includes(q);
      });
    }

    if (!list.length) {
      cont.innerHTML = `<div style="text-align:center;padding:50px 20px;color:var(--text-muted)">
        <div style="font-size:36px;margin-bottom:12px;opacity:0.6">💬</div>
        <p style="font-size:15px;margin-bottom:6px;font-weight:700">No conversations here</p>
        <p style="font-size:12.5px">Tap the <b>+</b> button to message an authorized contact.</p>
      </div>`;
      return;
    }

    cont.innerHTML = list.map(c => {
      const partner = c.other || (S.user.id === c.user_a.id ? c.user_b : c.user_a);
      const isSpectator = S.user.role === 'admin' && !c.is_direct_admin;
      const initial = (partner.name || partner.username).charAt(0).toUpperCase();
      const time = c.last_message_at ? c.last_message_at.slice(11, 16) : '';
      const unreadBadge = c.unread > 0 ? `<span class="badge">${c.unread}</span>` : '';

      return `
        <div class="conv-item" onclick="openChat(${c.id})">
          <div class="avatar">${initial}</div>
          <div class="conv-info">
            <div class="conv-top">
              <span class="conv-name">${escapeHtml(partner.name || partner.username)}${isSpectator ? ' <span style="font-size:10px;color:var(--accent2);font-weight:800">[AUDIT]</span>' : ''}</span>
              <span class="conv-time">${time}</span>
            </div>
            <div class="conv-bottom">
              <span class="conv-last">${escapeHtml(c.last_message_text || 'No messages yet')}</span>
              <div style="display:flex;align-items:center;gap:6px">
                <span class="role-tag role-${partner.role}">${partner.role_label || partner.role}</span>
                ${unreadBadge}
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  async function loadContacts() {
    try {
      S.contacts = await api('/api/chat/contacts');
      renderContactsList();
    } catch (e) {}
  }

  function renderContactsList() {
    const cont = $('convContainer');
    const q = $('sQuery').value.trim().toLowerCase();

    let list = S.contacts;
    if (q) {
      list = list.filter(u => (u.name || '').toLowerCase().includes(q) || u.username.toLowerCase().includes(q));
    }

    if (!list.length) {
      cont.innerHTML = `<div style="text-align:center;padding:50px 20px;color:var(--text-muted)">
        <div style="font-size:36px;margin-bottom:12px;opacity:0.6">👥</div>
        <p style="font-size:15px;margin-bottom:6px;font-weight:700">No authorized contacts found</p>
      </div>`;
      return;
    }

    cont.innerHTML = list.map(u => `
      <div class="conv-item" onclick="startChatWith(${u.id})">
        <div class="avatar">${(u.name || u.username).charAt(0).toUpperCase()}</div>
        <div class="conv-info">
          <div class="conv-top">
            <span class="conv-name">${escapeHtml(u.name || u.username)}</span>
            <span class="role-tag role-${u.role}">${u.role_label || u.role}</span>
          </div>
          <div class="conv-bottom">
            <span class="conv-last">@${escapeHtml(u.username)}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function loadComplaints() {
    try {
      S.complaints = await api('/api/complaints');
      renderComplaintsList();
    } catch (e) {}
  }

  function renderComplaintsList() {
    const cont = $('convContainer');
    if (!S.complaints.length) {
      cont.innerHTML = `<div style="text-align:center;padding:50px 20px;color:var(--text-muted)">
        <div style="font-size:36px;margin-bottom:12px;opacity:0.6">⚠️</div>
        <p style="font-size:15px;margin-bottom:6px;font-weight:700">No complaints submitted</p>
        <p style="font-size:12.5px">Tap the <b>+</b> button below to submit a ticket to Admin.</p>
      </div>`;
      return;
    }

    cont.innerHTML = S.complaints.map(c => {
      const stColor = c.status === 'Resolved' ? 'var(--ok)' : (c.status === 'In Progress' ? 'var(--accent)' : 'var(--warn)');
      return `
        <div class="conv-item">
          <div class="avatar" style="background:var(--surface-elevated);color:var(--warn)">⚠️</div>
          <div class="conv-info">
            <div class="conv-top">
              <span class="conv-name">#${c.id} ${escapeHtml(c.subject)}</span>
              <span class="conv-time">${(c.created_at || '').slice(5, 16)}</span>
            </div>
            <div class="conv-bottom">
              <span class="conv-last">${escapeHtml(c.body)}</span>
              <span class="role-tag" style="color:${stColor};background:rgba(255,255,255,0.06)">${c.status}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderAccountView() {
    const cont = $('convContainer');
    cont.innerHTML = `
      <div style="padding:24px 18px">
        <div style="text-align:center;margin-bottom:24px">
          <div class="avatar" style="width:72px;height:72px;font-size:28px;margin:0 auto 12px">${S.user.username.charAt(0).toUpperCase()}</div>
          <h3 style="font-size:18px;font-weight:800">${escapeHtml(S.user.name || S.user.username)}</h3>
          <p style="font-size:12px;color:var(--text-muted);margin-top:4px">@${escapeHtml(S.user.username)}</p>
          <div style="margin-top:8px"><span class="role-tag role-${S.user.role}">${S.user.role.toUpperCase()}</span></div>
        </div>

        <div style="background:var(--surface-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:16px">
          <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px">Server Endpoint</div>
          <div style="font-size:13.5px;color:var(--accent);word-break:break-all">${S.server}</div>
        </div>

        <button type="button" class="btn-primary" style="background:rgba(239,68,68,0.18);border:1px solid rgba(239,68,68,0.4);color:#FCA5A5;box-shadow:none" onclick="doLogout()">
          Log Out of Galaxy Chat
        </button>
      </div>
    `;
  }

  window.onSearchInput = function() {
    if (S.activeNav === 'chats') renderConversations();
    else if (S.activeNav === 'contacts') renderContactsList();
  };

  window.openChat = async function(convId) {
    const conv = S.convs.find(c => c.id === convId);
    if (!conv) return;

    S.activeConv = conv;
    const partner = conv.other || (S.user.id === conv.user_a.id ? conv.user_b : conv.user_a);
    const isSpectator = S.user.role === 'admin' && !conv.is_direct_admin;

    $('cAvatar').textContent = (partner.name || partner.username).charAt(0).toUpperCase();
    $('cPartnerName').textContent = partner.name || partner.username;
    $('cPartnerRole').textContent = partner.role_label || partner.role;

    const banner = $('specBanner');
    banner.style.display = isSpectator ? 'flex' : 'none';

    $('screenChat').classList.add('active');
    loadMessages(convId);

    api(`/api/chat/messages/${convId}/read`, 'POST').catch(() => {});
  };

  window.closeChat = function() {
    $('screenChat').classList.remove('active');
    S.activeConv = null;
    loadConversations();
  };

  async function loadMessages(convId) {
    try {
      const res = await api(`/api/chat/messages/${convId}?limit=50`);
      S.messages = [];
      (res.messages || []).forEach(m => appendOrUpdateMessage(m));
      renderMessages();
      scrollToBottom();
    } catch (e) {}
  }

  function appendOrUpdateMessage(m) {
    if (!m || !m.id) return false;
    const mid = Number(m.id);
    if (!Array.isArray(S.messages)) S.messages = [];
    const idx = S.messages.findIndex(existing => Number(existing.id) === mid);
    if (idx !== -1) {
      S.messages[idx] = Object.assign({}, S.messages[idx], m);
      return false;
    }
    S.messages.push(m);
    S.messages.sort((a, b) => Number(a.id) - Number(b.id));
    return true;
  }

  function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024, s = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + s[i];
  }

  function renderMessages() {
    const box = $('msgBox');
    if (!box) return;
    const isSpectator = S.user.role === 'admin' && S.activeConv && !S.activeConv.is_direct_admin;

    if (!Array.isArray(S.messages) || S.messages.length === 0) {
      box.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px"><div style="font-size:32px;margin-bottom:8px">💬</div>No messages yet — start the conversation!</div>';
      return;
    }

    // Strict deduplication guard
    const seen = new Set();
    const unique = [];
    for (const m of S.messages) {
      const mid = Number(m.id);
      if (!seen.has(mid)) {
        seen.add(mid);
        unique.push(m);
      }
    }
    S.messages = unique;

    box.innerHTML = S.messages.map(m => {
      const mine = !isSpectator && (m.sender_id === S.user.id);
      const isDeleted = m.is_deleted === true || m.deleted_for_everyone === 1;
      const ticks = m.read_at ? '<span class="ticks read">✓✓</span>' : '<span class="ticks">✓</span>';
      const time = (m.created_at || '').slice(11, 16);

      let senderHeader = '';
      if (isSpectator || (!mine && S.activeConv && S.activeConv.rel_category)) {
        senderHeader = `
          <div class="sender-header">
            <span class="sender-label">${escapeHtml(m.sender_name || 'User')}</span>
            <span class="role-tag role-${(m.sender_role || '').toLowerCase()}">${m.sender_role || ''}</span>
          </div>
        `;
      }

      let contentHtml = '';
      if (isDeleted) {
        contentHtml = '<div>🚫 This message was deleted</div>';
      } else {
        if (m.attachment_path) {
          const isCsv = (m.attachment_type === 'csv');
          const dlUrl = `${S.server}/api/chat/messages/${m.id}/download?token=${encodeURIComponent(S.token)}`;
          contentHtml += `
            <div class="bubble-file-card">
              <div class="file-icon">${isCsv ? '📊' : '📄'}</div>
              <div class="file-info">
                <div class="file-name">${escapeHtml(m.attachment_name || 'file')}</div>
                <div class="file-meta">${formatBytes(m.attachment_size)} · ${isCsv ? 'CSV' : 'TXT'}</div>
              </div>
              <a class="file-dl-btn" href="${dlUrl}" target="_blank" download="${escapeHtml(m.attachment_name || 'file')}" onclick="event.stopPropagation()">⬇ Download</a>
            </div>
          `;
        }
        if (m.body && (!m.attachment_path || m.body !== m.attachment_name)) {
          contentHtml += `<div>${escapeHtml(m.body)}</div>`;
        }
      }

      const bubbleClass = isDeleted
        ? 'bubble deleted-bubble'
        : (isSpectator ? 'bubble spectator-bubble' : 'bubble');

      const pressAttr = isDeleted ? '' : `onpointerdown="startMsgPress(${m.id}, event)" onpointerup="cancelMsgPress()" onpointercancel="cancelMsgPress()" oncontextmenu="openMsgActionSheet(${m.id}); return false;"`;

      return `
        <div class="msg-row ${mine ? 'mine' : 'them'}" id="msgRow_${m.id}">
          <div class="${bubbleClass}" ${pressAttr}>
            ${senderHeader}
            ${contentHtml}
            <div class="bubble-meta">
              <span>${time}</span>
              ${mine && !isDeleted ? ticks : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function scrollToBottom() {
    const box = $('msgBox');
    box.scrollTop = box.scrollHeight;
  }

  window.autoExpand = function(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  };

  /* P21: File attachments */
  let selectedChatFile = null;

  window.openFilePicker = function(e) {
    if (e && e.stopPropagation) e.stopPropagation();
    const fp = $('filePicker');
    if (fp) fp.click();
  };

  window.onFileSelected = function(inp) {
    if (inp.files && inp.files[0]) {
      const f = inp.files[0];
      const ext = (f.name || '').split('.').pop().toLowerCase();
      if (ext !== 'txt' && ext !== 'csv') {
        alert('Only .txt and .csv files are supported');
        inp.value = '';
        return;
      }
      if (f.size > 10 * 1024 * 1024) {
        alert('File exceeds 10MB limit');
        inp.value = '';
        return;
      }
      selectedChatFile = f;
      renderAttachPreview();
    }
  };

  window.clearAttachFile = function() {
    selectedChatFile = null;
    $('filePicker').value = '';
    renderAttachPreview();
  };

  function renderAttachPreview() {
    const bar = $('attachPreview');
    if (!selectedChatFile) {
      bar.style.display = 'none';
      bar.innerHTML = '';
      return;
    }
    const isCsv = selectedChatFile.name.toLowerCase().endsWith('.csv');
    bar.style.display = 'flex';
    bar.innerHTML = `
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${isCsv ? '📊' : '📄'} <b>${escapeHtml(selectedChatFile.name)}</b> (${formatBytes(selectedChatFile.size)})</span>
      <button type="button" class="attach-x" onclick="clearAttachFile()">✕</button>
    `;
  }

  window.sendMessage = async function() {
    const input = $('mInput');
    const text = input.value.trim();
    if (!text && !selectedChatFile) return;
    if (!S.activeConv) return;
    if (S.isSending) return; // Prevent concurrent send actions

    S.isSending = true;
    const sendBtn = $('mSend');
    if (sendBtn) sendBtn.disabled = true;

    input.value = '';
    autoExpand(input);

    try {
      Native.vibrate(20);
      if (selectedChatFile) {
        const fd = new FormData();
        fd.append('file', selectedChatFile);
        if (text) fd.append('body', text);

        const r = await fetch(`${S.server}/api/chat/conversations/${S.activeConv.id}/upload`, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + S.token
          },
          body: fd
        });
        const res = await r.json();
        if (!r.ok) throw new Error(res.error || 'Upload failed');
        clearAttachFile();
        if (res && res.message) {
          appendOrUpdateMessage(res.message);
          renderMessages();
          scrollToBottom();
        }
      } else {
        const res = await api(`/api/chat/messages/${S.activeConv.id}`, 'POST', { body: text });
        if (res && res.message) {
          appendOrUpdateMessage(res.message);
          renderMessages();
          scrollToBottom();
        }
      }
    } catch (e) {
      alert('Failed to send: ' + e.message);
    } finally {
      S.isSending = false;
      if (sendBtn) sendBtn.disabled = false;
      input.focus();
    }
  };

  /* P21: Long Press Message Action Sheet */
  let pressTimer = null;
  let didLongPress = false;

  window.startMsgPress = function(msgId, e) {
    didLongPress = false;
    if (pressTimer) clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      didLongPress = true;
      try { Native.vibrate(30); } catch (_) {}
      openMsgActionSheet(msgId);
    }, 450);
  };

  window.cancelMsgPress = function() {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
  };

  window.openMsgActionSheet = function(msgId) {
    const msg = S.messages.find(m => m.id === msgId);
    if (!msg || msg.is_deleted) return;

    S.selectedMsg = msg;
    const isSender = (msg.sender_id === S.user.id);
    const isAdmin = (S.user.role === 'admin');

    const msgAgeMinutes = (Date.now() - new Date(msg.created_at).getTime()) / 60000;
    const canDeleteEveryone = isAdmin || (isSender && msgAgeMinutes <= 15);

    $('sheetInfo').textContent = `Message from ${msg.sender_name || 'User'} (${(msg.created_at || '').slice(11, 16)})`;
    $('btnDelEveryone').style.display = canDeleteEveryone ? 'flex' : 'none';

    $('msgSheet').classList.add('active');
  };

  window.closeSheet = function() {
    $('msgSheet').classList.remove('active');
    S.selectedMsg = null;
  };

  window.onSheetBackdrop = function(e) {
    if (e.target.id === 'msgSheet') closeSheet();
  };

  window.copySelectedMessage = function() {
    if (!S.selectedMsg) return;
    const cleanText = S.selectedMsg.body || S.selectedMsg.attachment_name || '';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cleanText);
    } else {
      const ta = document.createElement('textarea');
      ta.value = cleanText; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
    Native.toast('Copied to clipboard');
    closeSheet();
  };

  window.deleteMessageForMe = async function() {
    if (!S.selectedMsg) return;
    const msgId = S.selectedMsg.id;
    closeSheet();

    try {
      await api(`/api/chat/messages/${msgId}/delete-for-me`, 'POST');
      S.messages = S.messages.filter(m => m.id !== msgId);
      renderMessages();
      Native.vibrate(25);
    } catch (e) {
      alert('Failed to delete: ' + e.message);
    }
  };

  window.deleteMessageForEveryone = async function() {
    if (!S.selectedMsg) return;
    const msgId = S.selectedMsg.id;
    if (!confirm('Delete this message for everyone?')) return;
    closeSheet();

    try {
      await api(`/api/chat/messages/${msgId}/delete-for-everyone`, 'POST');
      const target = S.messages.find(m => m.id === msgId);
      if (target) {
        target.is_deleted = true;
        target.body = 'This message was deleted';
        target.deleted_for_everyone = 1;
      }
      renderMessages();
      Native.vibrate(35);
    } catch (e) {
      alert('Failed to delete for everyone: ' + e.message);
    }
  };

  // Contacts
  window.openNewChatModal = function() {
    switchNav('contacts');
  };

  window.closeModal = function(id) {
    $(id).classList.remove('active');
  };

  window.startChatWith = async function(targetUserId) {
    try {
      const res = await api('/api/chat/conversations', 'POST', { user_id: targetUserId });
      await loadConversations();
      openChat(res.conversation_id);
    } catch (e) {
      alert('Cannot start chat: ' + e.message);
    }
  };

  window.submitComplaint = async function() {
    const subject = $('compSubject').value.trim();
    const body = $('compBody').value.trim();
    if (!subject || !body) return alert('Subject and details are required');

    try {
      await api('/api/complaints', 'POST', { subject, body });
      closeModal('compModal');
      $('compSubject').value = '';
      $('compBody').value = '';
      alert('✅ Complaint submitted successfully to Admin.');
      loadComplaints();
    } catch (e) {
      alert('❌ ' + e.message);
    }
  };

  // Real-time SSE Connection & Event Handling
  async function connectSSE() {
    if (S.es) return;
    try {
      const { ticket } = await api('/api/chat/ticket', 'POST');
      const streamUrl = S.server.replace(/\/+$/, '') + '/api/chat/stream?ticket=' + ticket;

      S.es = new EventSource(streamUrl);

      S.es.onopen = () => {
        $('connDot').className = 'brand-dot';
        $('connDot').title = 'Connected';
      };

      // Incoming Chat Message
      S.es.addEventListener('msg', (e) => {
        const data = JSON.parse(e.data);
        const m = data.m;

        // Message rendering in active conversation
        if (S.activeConv && Number(S.activeConv.id) === Number(data.c)) {
          appendOrUpdateMessage(m);
          renderMessages();
          scrollToBottom();
          api(`/api/chat/messages/${data.c}/read`, 'POST').catch(() => {});
        } else {
          loadConversations();
        }

        // Notification Generation Logic
        // Triggers for EVERY genuinely new incoming message when backgrounded or viewing another chat
        const isAppBackgrounded = (document.visibilityState === 'hidden') || (!document.hasFocus());
        const isDifferentChat = (!S.activeConv || Number(S.activeConv.id) !== Number(data.c));

        if (m.sender_id !== S.user.id && !S.seenNotifIds.has(m.id)) {
          S.seenNotifIds.add(m.id);
          playNotificationChime();
          Native.vibrate([60, 100, 60]);

          if (isAppBackgrounded || isDifferentChat) {
            Native.showNotification(`New message from ${m.sender_name}`, m.body);
          }
        }
      });

      // Read receipt
      S.es.addEventListener('read', (e) => {
        const data = JSON.parse(e.data);
        if (S.activeConv && Number(S.activeConv.id) === Number(data.c)) {
          S.messages.forEach(m => { if (m.sender_id === S.user.id) m.read_at = new Date().toISOString(); });
          renderMessages();
        }
      });

      // Message deleted for everyone
      S.es.addEventListener('msg_deleted', (e) => {
        const data = JSON.parse(e.data);
        if (S.activeConv && Number(S.activeConv.id) === Number(data.c)) {
          const target = S.messages.find(m => Number(m.id) === Number(data.message_id));
          if (target) {
            target.is_deleted = true;
            target.body = 'This message was deleted';
            target.deleted_for_everyone = 1;
            renderMessages();
          }
        }
        loadConversations();
      });

      // Access revoked
      S.es.addEventListener('revoked', () => {
        alert('🔒 Chat access has been disabled by Admin.');
        doLogout();
      });

      S.es.onerror = () => {
        $('connDot').className = 'brand-dot reconnecting';
        $('connDot').title = 'Reconnecting...';
        if (S.es) { S.es.close(); S.es = null; }
        setTimeout(connectSSE, 5000);
      };
    } catch (e) {
      setTimeout(connectSSE, 8000);
    }
  }

  async function updateBadges() {
    try {
      const counts = await api('/api/chat/unread-count');
      const bChat = $('bChats');
      if (bChat) {
        bChat.textContent = counts.chat || 0;
        bChat.style.display = counts.chat > 0 ? 'inline-block' : 'none';
      }
      const bComp = $('bComp');
      if (bComp) {
        bComp.textContent = counts.complaints || 0;
        bComp.style.display = counts.complaints > 0 ? 'inline-block' : 'none';
      }
    } catch (e) {}
  }

  // Start app
  init();
})();
</script>
</body>
</html>
