# Power X SMS — nginx reverse proxy (Phase-1 Step 6)
# Install: cp deploy/nginx-powerx.conf /etc/nginx/sites-available/powerx
#          ln -s /etc/nginx/sites-available/powerx /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#
# Replace powerx.example.com with your domain and 4000 with your PORT if changed.
# The backend itself must only listen on localhost:  PM2 env PORT=4000 + firewall (ufw deny 4000/tcp)

# EDGE RATE-LIMIT ZONE — must live OUTSIDE the server{} block (sites-enabled
# files are included inside http{}, so top-of-file here is http context).
limit_req_zone $binary_remote_addr zone=powerx_api:10m rate=30r/s;

server {
    listen 80;
    server_name powerx.example.com;

    # TLS (after certbot): certbot --nginx -d powerx.example.com

    # Uploads (CSV import multipart)
    client_max_body_size 200m;

    # gzip: JSON responses ~70% smaller -> faster panels on slow links
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    # Basic abuse guard at the edge (backend has its own per-user limits too)

    location / {
        limit_req zone=powerx_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Slow mobile clients are buffered here, not in Node:
        proxy_buffering on;
        proxy_buffers 16 16k;
    }

    # Large generated export files (Phase-2) served by nginx via X-Accel-Redirect:
    # location /protected-exports/ { internal; alias /var/tmp/powerx-exports/; }
}
